name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint, Format & Test (Node + Rust)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      MSS_RESOURCE_DIR: resources
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mss-export-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/mss-export-rs/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint --quiet .

      - name: Format check
        run: npm run format:check

      - name: Build web & host
        run: npm run build

      - name: Test Rust native exporter
        run: npm run test:rust

      - name: Build Rust native exporter
        run: npm run build:rust

      - name: Run all unit tests
        run: npm run test:all

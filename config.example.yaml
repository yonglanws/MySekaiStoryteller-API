# =============================================================================
# MySekaiStoryteller-API 渲染宿主统一配置
# =============================================================================
# 使用方法：
#   cp config.example.yaml config.yaml   然后按需修改 config.yaml
#
# 优先级：MSS_* 环境变量 > config.yaml > 内置默认值（即本文件的注释值）
# config.yaml 不会被 git 跟踪，可放心存放私有路径

# ---------------------------------------------------------------------------
# 服务监听
# ---------------------------------------------------------------------------
server:
  port: 9881          # API / 静态资源 / 桥接层共用端口（env: MSS_PORT）
  host: 0.0.0.0       # 监听地址；仅本机使用可改 127.0.0.1（env: MSS_HOST）

# ---------------------------------------------------------------------------
# 视频导出参数
# ---------------------------------------------------------------------------
video:
  width: 1920         # 输出视频宽度
  height: 1080         # 输出视频高度
  fps: 60             # 帧率
  crf: 28             # 质量因子（越小质量越高、体积越大）
  renderScale: 1    # 渲染倍率（相对 1280 宽逻辑坐标；1 = 按输出分辨率 1:1 渲染，
                      # 1.5 = 超采样抗锯齿更好、每帧成本 x2.25，
                      # <1 = 降渲染分辨率提速，画面变软。例：1080p 输出下
                      # 1 = 渲染 1080p，0.75 = 渲染 810p 再放大）
  audioBitrate: 128k  # 音频码率
  encoder: auto       # 视频编码器：auto | nvidia | amd | intel | libx264
                      # auto 自动探测硬件编码器（NVIDIA→AMD→Intel），全部失败回退 libx264
                      # 对应 ffmpeg：nvidia=h264_nvenc，amd=h264_amf，intel=h264_qsv
                      # 无独显或只要 CPU 编码时写 libx264（env: MSS_FFMPEG_ENCODER）
  watermark: true     # 右上角水印（env: MSS_VIDEO_WATERMARK）
                      # 本视频由 MySekaiStoryteller-API 生成
                      # Designed by GuangChen2333 & 慵懒午睡
  watermarkText: ""   # 自定义水印文字：右对齐显示在自带两行水印的下一行，
                      # 支持最多 2 行（\n 换行），留空则只显示自带水印
                      # （env: MSS_VIDEO_WATERMARK_TEXT）
  exportMode: record  # 导出管线：record | fast（env: MSS_EXPORT_MODE）
                      # record = 实时采集，宿主并行编码并在末尾只合入音轨
                      # fast   = 虚拟时钟逐帧渲染 + WebCodecs 直编 MP4，
                      #          运行环境不支持时自动回退 record
  recordTargetSizeMb: 0    # record 收尾成片体积上限 MiB（env: MSS_RECORD_TARGET_SIZE_MB）
                           # 收尾预估（录制视频 + 音轨）超出上限 2% 时，按精确码率重编码
                           # 视频压回上限（分辨率与时间戳不变）；0 = 不限制
  exportBitrate: 12000000  # fast 模式视频码率 bps（env: MSS_EXPORT_BITRATE）
  ttsMode: serial          # TTS 与渲染调度：serial | concurrent（env: MSS_TTS_MODE）
                           # serial（默认）= 先串行合成完全部语音，再开始录制/渲染，
                           #                 避免 TTS 推理与 WebGL/编码抢 CPU/GPU
                           # concurrent = 边渲染边合成，总耗时更短但两条流水线并行争资源

  idleChainGapSec: 0       # 表演续演间隔秒数（0 = 关闭续演，默认）。
                           # 角色动作播完后：0 = 保持动作结束时的姿势（不回落站立），之后只有呼吸与眨眼
                           # （只有呼吸与眨眼）；>0 = 按该间隔（±25% 抖动）再接一个同情绪族
                           # 手势，想要"连续表演"的舞台风格再调大（env: MSS_IDLE_CHAIN_GAP_SEC）
  exportFastEncoder: auto # fast 模式页内编码路径：auto | webcodecs | frames
  fastFps: 30        # fast 模式编码帧率上限（env: MSS_FAST_FPS），不超过 video.fps；
                      # 动画仍按 video.fps 推进，低上限只减少抓帧/编码次数
                      # auto：Linux+NVIDIA 时 WebCodecs 只有软编（慢），自动改走
                      #       JPEG 帧序列 + ffmpeg 硬件编码；其余平台优先 WebCodecs

# ---------------------------------------------------------------------------
# 渲染池（无头浏览器工作进程）
# ---------------------------------------------------------------------------
render:
  workers: 2                      # 常驻渲染 worker 数（每 worker 独立 WebGL 上下文，
                                  # 约占 300-500MB 内存）（env: MSS_WORKERS）
  maxConcurrentExports: 0         # 同时导出上限；0 = 跟随 workers（env: MSS_MAX_CONCURRENT_EXPORTS）。
                                  # 设成小于 workers 可保留热备 worker：并发仍受限，崩溃/回收时不用等新浏览器
  workerRecycleExports: 5         # 每个页面完成 N 次导出后回收重建，防止 Live2D 内存累积（0 = 不回收）
  browserChannels:                # 浏览器探测顺序，依次回退（env: MSS_BROWSER_CHANNELS）
    - msedge
    - chrome
    - chromium
  browserExecutablePath: ""       # 显式指定浏览器可执行文件，优先于 channels（env: MSS_BROWSER_EXECUTABLE）
  extraChromeArgs: ""             # 附加 Chrome 启动参数，空格分隔（env: MSS_CHROME_ARGS）
                                  # Linux NVIDIA 无桌面示例: "--use-angle=vulkan"（同时把 linuxGpuAngle 设 false）
  linuxGpuAngle: true             # Linux 上自动追加 --use-angle=gl；无 X 的 NVIDIA 机器请设 false（env: MSS_LINUX_GPU_ANGLE）
  minFreeMemoryMb: 0              # 派发导出任务前要求的最小可用内存 MB（0 = 关闭护栏）；
                                  # 内存紧张的服务器可设 1500 之类，暂缓派发避免 OOM（env: MSS_MIN_FREE_MEMORY_MB）

# ---------------------------------------------------------------------------
# 路径（相对仓库根，也可写绝对路径）
# ---------------------------------------------------------------------------
paths:
  output: apifile                 # 导出视频与故事 JSON 的输出目录（env: MSS_OUTPUT_DIR）
  resources: resources            # 资源根：models/ images/ voices/ audio/ stories/（env: MSS_RESOURCE_DIR）
  webRenderer: out/webrenderer    # webrenderer 构建产物目录（npm run build:web 生成）

# ---------------------------------------------------------------------------
# TTS 语音合成（GPT-SoVITS / IrodoriTTS）
# ---------------------------------------------------------------------------
tts:
  enabled: true                   # 关闭后导出仍会成功，只是没有角色配音（env: MSS_TTS_ENABLED）
  provider: gpt-sovits            # gpt-sovits | irodori（env: MSS_TTS_PROVIDER）
  apiBaseUrl: http://127.0.0.1:9880   # GSV: http://host:9880；Irodori: http://host:8088（env: MSS_TTS_API_BASE_URL）
  timeoutMs: 120000               # 单次 TTS 请求超时（env: MSS_TTS_TIMEOUT_MS）
  defaultRefAudioPath: ""         # 默认参考音频（TTS 服务端可访问的路径）
  defaultPromptText: ""           # GSV 默认提示文本 / Irodori 默认 caption 的回退
  promptLang: ja                  # GSV 提示文本语言
  textLang: ja                    # GSV 合成文本语言
  speedFactor: 1.0                # 语速倍率
  gptWeightsPath: ""              # 可选：全局默认 GPT 权重（GSV 服务端本地路径）
  sovitsWeightsPath: ""           # 可选：全局默认 SoVITS 权重
  # IrodoriTTS 推理默认值（provider=irodori 时生效，env: MSS_IRODORI_MODEL / MSS_IRODORI_NUM_STEPS）
  irodori:
    model: irodori-tts
    responseFormat: wav
    numSteps: 40
    cfgScaleText: 3.0
    cfgScaleCaption: 3.0
    cfgScaleSpeaker: 5.0
    durationScale: 1.0
    chunkingEnabled: true
    chunkMinChars: 80
    seed: -1                      # -1 = 每次随机
    defaultLoraAdapter: ""        # 角色未填 loraAdapter 时的全局默认
    defaultCaption: ""            # 角色未填 caption 时的全局默认
    emotionLabels: [平静, 开心, 生气, 伤心, 害羞, 惊讶]
  # 角色专属声音（未列出的角色使用上方默认值）
  characters: []
  # characters:
  #   - characterName: 晓山瑞希
  #     refAudioPath: /path/to/ref.wav    # GSV / Irodori 服务端本地路径
  #     promptText: 参考音频说的话        # GSV 用；Irodori 无 caption 时回退到这里
  #     promptLang: ja
  #     gptWeightsPath: ""                # 可选：角色专属 GPT 权重
  #     sovitsWeightsPath: ""             # 可选：角色专属 SoVITS 权重
  #     # 以下仅 Irodori 使用
  #     loraAdapter: /path/to/lora_adapter
  #     caption: 明るく軽い口調で話している。
  #     refAudioPaths: []                 # 多参考音频；非空时优先于 refAudioPath
  #     speed: 1.0
  #     numSteps: 40
  #     emotions:
  #       - emotion: 平静
  #         refAudioPath: /path/to/emotion_refs/calm.wav
  #       - emotion: 开心
  #         refAudioPath: /path/to/emotion_refs/happy.wav
  #         caption: 嬉しそうに話している。
  #         speed: 1.1

# ---------------------------------------------------------------------------
# 背景音乐
#
# BGM 设置不在本文件，改由资源根下的独立文件维护：
#   resources/audio/bgm/bgm.yaml（示例见同目录 bgm.example.yaml）
#
#   enabled: true              # 导出时混入 BGM
#   path: audio/bgm/bg1.mp3    # 相对资源根的路径，也可用绝对路径或 http(s) URL
#   volume: 0.2                # 音量 0.0 - 1.0
#
# 该文件不存在时，宿主回落到本文件的 bgm 节（enabled / path / volume）。
# 剧本里的 ChangeBgm 片段可在场景内切歌/停止；出现带文件的 ChangeBgm 时，
# path 的全局默认曲目不再混入，只加载被引用的 audio/bgm/<file>。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 宿主内置 AI 剧本生成（OpenAI 兼容 Chat Completions）
#
# 客户端只提交一句场景描述，宿主完成「选角 → 台词 → 表演设计 → TTS 翻译」；
# 密钥只从 apiKeyEnv 指定的环境变量读取，不写进本文件：
#   export MSS_LLM_API_KEY=sk-...
# baseUrl 可指向官方 OpenAI、new-api、Ollama（http://127.0.0.1:11434/v1）等。
# ---------------------------------------------------------------------------
llm:
  enabled: true                   # 关闭后 /api/v1/script/generate 返回 422（env: MSS_LLM_ENABLED）
  baseUrl: https://api.openai.com/v1   # 服务根地址，不要重复写 /chat/completions（env: MSS_LLM_BASE_URL）
  apiKeyEnv: MSS_LLM_API_KEY      # 读取密钥的环境变量名（env: MSS_LLM_API_KEY_ENV）
  model: gpt-4.1-mini             # 模型名（env: MSS_LLM_MODEL）
  temperature: 0.85               # 台词创作温度（env: MSS_LLM_TEMPERATURE）
  maxTokens: 8192                 # 单轮输出上限（env: MSS_LLM_MAX_TOKENS）
  timeoutMs: 120000               # 单次 LLM 请求超时（env: MSS_LLM_TIMEOUT_MS）
  retries: 2                      # 网络错误/429/5xx 重试次数（env: MSS_LLM_RETRIES）
  repairRounds: 2                 # single 的校验失败重写轮数；staged 台词/表演各重试一次（env: MSS_LLM_REPAIR_ROUNDS）
  # staged（默认）：选角 → 只写台词（只带入选角色的核心人设段落）→ 单独设计动作/表情/背景。
  # single：先快速选角，再一次调用写完整剧本；想压缩调用次数时用（env: MSS_LLM_PIPELINE）。
  pipeline: staged
  jsonMode: auto                  # auto = 先带 response_format 再回退；on = 必须；off = 不发送
  translateForTts: true           # 把中文台词翻译成 ttsText 日文（env: MSS_LLM_TRANSLATE）
  targetMinutes: 3                # 提示词里的目标成片时长（env: MSS_LLM_TARGET_MINUTES）
  systemPrompt: ""                # single 覆盖内置系统提示词；staged 追加到每段系统提示词（env: MSS_LLM_SYSTEM_PROMPT）
  extraBody: {}                   # 原样并入请求体，例如 {"thinking":{"type":"disabled"}}（env: MSS_LLM_EXTRA_BODY）
  personaDirs: []                 # 人格目录：读取其中的 *.md / *.txt（文件名或 frontmatter name 为角色名）
                                  # 长人设只提取核心机制/语言与风格/角色档案/核心禁忌进入对白提示词
  personas: []                    # 内联人格：name / prompt / aliases / group
  # personas:
  #   - name: 晓山瑞希
  #     aliases: [瑞希, mizuki]
  #     prompt: |
  #       外貌、性格、说话风格、口头禅、禁忌、表情倾向……

# ---------------------------------------------------------------------------
# 云端资源获取（Moesekai / pjsk.moe）
#
# 从公开剧情库拉取 Live2D 模型与动作，转换成宿主可直接渲染的资源目录。
# 模型包本身没有 motion3：动作是 sse-motion.json，宿主按三次多项式无损转成
# motion3 后写入模型包的 motions/，并自动登记到 models.yaml。
# 常用命令：
#   npm run fetch:models -- --characters mizuki,ena
#   npm run fetch:models -- --characters all
#   npm run fetch:models -- --models 20mizuki_normal_3.0_t04
# ---------------------------------------------------------------------------
assets:
  source: moesekai                # 目前支持 moesekai
  region: jp                      # jp | cn | tw | kr | en（env: MSS_ASSETS_REGION）
  indexBase: https://assets.pjsk.moe/sekai-extra-assets/sekai-live2d/
                                  # 模型索引：<indexBase><region>/models.json
  libraryBase: https://assets.pjsk.moe/sekai-extra-assets/sekai-story/ripper/
                                  # 剧情库：<libraryBase><region>/library/
  assetBase: ""                   # 背景等普通资产；留空按 region 推导 storage.exmeaning.com
  soundtrackBase: https://cdn.jsdelivr.net/gh/Sekai-World/sekai-master-db-diff@master/
                                  # PJSK 官方 BGM 曲名索引；fetch:media 用它把 bgm00003 补成可读曲名
                                  # 不通时可换 raw.githubusercontent.com 镜像（env: MSS_ASSETS_SOUNDTRACK_BASE）
  cacheDir: cache/moesekai        # 动作包缓存（可断点续传，不进 Git；env: MSS_ASSETS_CACHE_DIR）
  concurrency: 4                  # 并行下载数（env: MSS_ASSETS_CONCURRENCY）
  timeoutMs: 180000               # 单个文件下载超时（env: MSS_ASSETS_TIMEOUT_MS）
  retries: 3                      # 下载重试次数（env: MSS_ASSETS_RETRIES）
  cloudCatalog: true              # 云端目录：背景/BGM/Live2D 自动发现，无需本地 YAML 登记
                                  # 剧本可写背景名（教室）、曲名（Slapstick!!）或云端 id；
                                  # 导出前按需下载到 resources/*/cloud/（env: MSS_ASSETS_CLOUD_CATALOG）
  cloudCatalogTtlHours: 6         # 目录缓存有效期（小时）；过期后台刷新，失败沿用旧快照
                                  # （env: MSS_ASSETS_CLOUD_CATALOG_TTL_HOURS）

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
logLevel: info                    # silly | trace | debug | info | warn | error | fatal（env: MSS_LOG_LEVEL）

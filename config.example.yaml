# =============================================================================
# MySekaiStoryteller-API 渲染宿主统一配置
# =============================================================================
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ 5 分钟极速配置区 / 5-Minute Quick Start                                     │
# ├───────────────────────────────────────────────────────────────────────────┤
# │ 推荐使用交互式向导一键生成 config.yaml 和 .env：                              │
# │   npm run init                                                            │
# │ 或手动复制本模板：                                                          │
# │   cp config.example.yaml config.yaml                                      │
# │                                                                           │
# │ 绝大多数用户只需关注以下 4 项，其余保持默认即可开箱运行：                      │
# │   1. AI 剧本模型：修改下方 llm.baseUrl + llm.model，并在 .env/环境中设置     │
# │      MSS_LLM_API_KEY=sk-...（密钥绝不写入 config.yaml）                     │
# │   2. 语音合成 TTS：暂无外部 TTS 服务时，将 tts.enabled 设为 false            │
# │      （或 MSS_TTS_ENABLED=false），视频仍可正常导出（仅无角色配音）            │
# │   3. 视频帧率与硬件加速：按机器条件选 video.fps (60/30) 与 video.encoder     │
# │      (auto/intel/nvidia/amd/libx264)；Docker/纯环境变量场景推荐直接设        │
# │      MSS_GPU_PROFILE=intel|nvidia|amd|cpu（别名 MSS_GPU_MODE）              │
# │      与 MSS_MEMORY_PROFILE=low|standard（4–8GB 内存主机/NAS 用 low）         │
# │   4. 零本地资源纯云端模式：assets.cloudOnly 默认已为 true，无需手动下载       │
# │      Live2D 模型/背景/BGM，导出时自动按需拉取并缓存                          │
# └───────────────────────────────────────────────────────────────────────────┘
#
# 优先级：细粒度 MSS_* 环境变量 > 组合预设 (MSS_GPU_PROFILE / MSS_MEMORY_PROFILE)
#         > config.yaml (可用 MSS_CONFIG_PATH 指定自定义路径) > 内置默认值
# config.yaml 与 .env 均已被 .gitignore 忽略，可放心存放私有配置

# ---------------------------------------------------------------------------
# 服务监听
# ---------------------------------------------------------------------------
server:
  port: 9881          # API / 静态资源 / 桥接层共用端口（env: MSS_PORT）
  host: 0.0.0.0       # 监听地址；仅本机使用可改 127.0.0.1（env: MSS_HOST）
  apiKey: ""          # Bearer 鉴权密钥；留空表示关闭（env: MSST_API_KEY / MSS_API_KEY）
  # cors: false       # 是否开启 CORS；省略时不主动覆盖宿主默认策略（env: MSS_SERVER_CORS）
  # corsOrigins:      # CORS 允许的 Origin 白名单（env: MSST_CORS_ORIGINS / MSS_CORS_ORIGINS）
  #   - http://localhost:3000

# ---------------------------------------------------------------------------
# 视频导出参数
# ---------------------------------------------------------------------------
video:
  width: 1920         # 输出视频宽度（env: MSS_VIDEO_WIDTH）
  height: 1080        # 输出视频高度（env: MSS_VIDEO_HEIGHT）
  fps: 60             # 帧率（env: MSS_VIDEO_FPS；MSS_MEMORY_PROFILE=low 时自动降为 30）
  crf: 27             # 质量因子（越小质量越高、体积越大；hevc_qsv -low_power 1 推荐 26–27）
  renderScale: 1      # 渲染倍率（相对 1280 宽逻辑坐标；1 = 按输出分辨率 1:1 渲染，
                      # 1.5 = 超采样抗锯齿更好、每帧成本 x2.25，
                      # <1 = 降渲染分辨率提速，画面变软。例：1080p 输出下
                      # 1 = 渲染 1080p，0.75 = 渲染 810p 再放大）
  codec: hevc         # 输出编码：hevc（经 Rust hevc_qsv -low_power 1 约 670fps 压制，~63MB 兼顾小体积与无暗部宏块）
                      # | h264（与 Edge WebCodecs I420 对齐，走 -c:v copy + BT.709 VUI 零重编码最快，~145MB）
  audioBitrate: 128k  # 音频码率
  encoder: auto       # 视频编码器：auto | nvidia | amd | intel | libx264
                      # auto 自动探测硬件编码器（NVIDIA→AMD→Intel），全部失败回退 libx264
                      # 对应 ffmpeg：nvidia=h264_nvenc，amd=h264_amf，intel=h264_qsv (hevc_qsv -low_power 1)
                      # 无独显或只要 CPU 编码时写 libx264
                      # （env: MSS_FFMPEG_ENCODER，便捷别名 MSS_VIDEO_ENCODER；两者同时设置时优先 MSS_FFMPEG_ENCODER；
                      #   也可由 MSS_GPU_PROFILE / MSS_GPU_MODE 预设：intel|nvidia|amd|cpu）
  watermark: true     # 右上角水印（env: MSS_VIDEO_WATERMARK）
                      # 本视频由 MySekaiStoryteller-API 生成
                      # Designed by GuangChen2333 & 慵懒午睡
  watermarkText: ""   # 自定义水印文字：右对齐显示在自带两行水印的下一行，
                      # 支持最多 2 行（\n 换行），留空则只显示自带水印
                      # （env: MSS_VIDEO_WATERMARK_TEXT）
  exportMode: fast    # 导出管线：fast | record（env: MSS_EXPORT_MODE；record 已废弃，自动回落 fast）
                      # fast   = 虚拟时钟逐帧渲染 + WebGL2 批处理 + WebCodecs 直编 + 原生 Rust 混音/合流
  recordTargetSizeMb: 0    # [已废弃] 仅向后兼容保留；fast 模式请通过 exportBitrate 控制体积
  exportBitrate: 5500000   # fast 模式视频码率 bps（env: MSS_EXPORT_BITRATE；2.5–5.5 Mbps 兼顾转场无宏块与体积）
  maxOutputMbps: 6.5       # 成品码率软上限 Mbps（env: MSS_MAX_OUTPUT_MBPS；超限时自动启用 Rust QSV CRF 重编码）
  useRustExporter: true    # 启用原生 Rust NAPI 导出器与音频/口型加速（env: MSS_USE_RUST_EXPORTER）
  exportJobs: 1            # 并行分段渲染数（env: MSS_EXPORT_JOBS；Intel Iris Xe 单媒体引擎下 1 最快，独显多流可调 2–3）
  ttsMode: concurrent      # TTS 与渲染调度：concurrent | serial（env: MSS_TTS_MODE）
                           # concurrent（默认）= 边渲染边并发合成语音，端到端耗时最短
                           # serial = 先合成完全部语音再开始渲染，避免与 WebGL/编码争资源

  idleChainGapSec: 0       # 表演续演间隔秒数（0 = 关闭续演，默认）。
                           # 角色动作播完后：0 = 保持动作结束时的姿势（不回落站立），之后只有呼吸与眨眼
                           # （只有呼吸与眨眼）；>0 = 按该间隔（±25% 抖动）再接一个同情绪族
                           # 手势，想要"连续表演"的舞台风格再调大（env: MSS_IDLE_CHAIN_GAP_SEC）
  exportFastEncoder: auto # fast 模式页内编码路径：auto | webcodecs | frames
  fastFps: 60        # fast 模式编码帧率上限（env: MSS_FAST_FPS），不超过 video.fps；
                      # 动画仍按 video.fps 推进，低上限只减少抓帧/编码次数
                      # auto：Linux+NVIDIA 时 WebCodecs 只有软编（慢），自动改走
                      #       JPEG 帧序列 + ffmpeg 硬件编码；其余平台优先 WebCodecs

# ---------------------------------------------------------------------------
# 渲染池（无头浏览器工作进程）
# ---------------------------------------------------------------------------
render:
  workers: 2                      # 常驻渲染 worker 数（每 worker 独立 WebGL 上下文，
                                  # 约占 300-500MB 内存）（env: MSS_WORKERS；MSS_MEMORY_PROFILE=low 自动设为 1）
  maxConcurrentExports: 0         # 同时导出上限；0 = 跟随 workers（env: MSS_MAX_CONCURRENT_EXPORTS；low 预设为 1）。
                                  # 设成小于 workers 可保留热备 worker：并发仍受限，崩溃/回收时不用等新浏览器
  workerRecycleExports: 5         # 每个页面完成 N 次导出后回收重建，防止 Live2D 内存累积（0 = 不回收；low 预设为 2）
  browserChannels:                # 浏览器探测顺序，依次回退（env: MSS_BROWSER_CHANNELS）
    - msedge
    - chrome
    - chromium
  browserExecutablePath: ""       # 显式指定浏览器可执行文件，优先于 channels（env: MSS_BROWSER_EXECUTABLE）
  extraChromeArgs: ""             # 附加 Chrome 启动参数，空格分隔（env: MSS_CHROME_ARGS）
                                  # Linux NVIDIA 无桌面示例: "--use-angle=vulkan"（同时把 linuxGpuAngle 设 false）
  linuxGpuAngle: true             # Linux 上自动追加 --use-angle=gl；无 X 的 NVIDIA 机器请设 false（env: MSS_LINUX_GPU_ANGLE）
  minFreeMemoryMb: 0              # 派发导出任务前要求的最小可用内存 MB（0 = 关闭护栏）；
                                  # 内存紧张的服务器可设 1500 之类，暂缓派发避免 OOM（env: MSS_MIN_FREE_MEMORY_MB）

# ---------------------------------------------------------------------------
# 路径（相对仓库根，也可写绝对路径）
# ---------------------------------------------------------------------------
paths:
  output: apifile                 # 导出视频与故事 JSON 的输出目录（env: MSS_OUTPUT_DIR）
  resources: resources            # 资源根：models/ images/ voices/ audio/ stories/（env: MSS_RESOURCE_DIR）
  webRenderer: out/webrenderer    # webrenderer 构建产物目录（npm run build:web 生成）

# ---------------------------------------------------------------------------
# TTS 语音合成（GPT-SoVITS / IrodoriTTS）
# ---------------------------------------------------------------------------
tts:
  enabled: true                   # 关闭后导出仍会成功，只是没有角色配音（env: MSS_TTS_ENABLED）
  provider: gpt-sovits            # gpt-sovits | irodori（env: MSS_TTS_PROVIDER）
  apiBaseUrl: http://127.0.0.1:9880   # GSV: http://host:9880；Irodori: http://host:8088（env: MSS_TTS_API_BASE_URL）
  timeoutMs: 120000               # 单次 TTS 请求超时（env: MSS_TTS_TIMEOUT_MS）
  defaultRefAudioPath: ""         # 默认参考音频（TTS 服务端可访问的路径）
  defaultPromptText: ""           # GSV 默认提示文本 / Irodori 默认 caption 的回退
  promptLang: ja                  # GSV 提示文本语言
  textLang: ja                    # GSV 合成文本语言
  speedFactor: 1.0                # 语速倍率
  gptWeightsPath: ""              # 可选：全局默认 GPT 权重（GSV 服务端本地路径）
  sovitsWeightsPath: ""           # 可选：全局默认 SoVITS 权重
  # IrodoriTTS 推理默认值（provider=irodori 时生效，env: MSS_IRODORI_MODEL / MSS_IRODORI_NUM_STEPS）
  irodori:
    model: irodori-tts
    responseFormat: wav
    numSteps: 40
    cfgScaleText: 3.0
    cfgScaleCaption: 3.0
    cfgScaleSpeaker: 5.0
    durationScale: 1.0
    chunkingEnabled: true
    chunkMinChars: 80
    seed: -1                      # -1 = 每次随机
    defaultLoraAdapter: ""        # 角色未填 loraAdapter 时的全局默认
    defaultCaption: ""            # 角色未填 caption 时的全局默认
    speakerKvScale: 1.15          # 早期去噪步说话人 K/V 缩放（锁住角色底色，避免情绪导致音色漂移）
    speakerKvMinT: 0.9            # speakerKvScale 生效的最小时间步（默认 0.9）
    # speakerKvMaxLayers: 12      # 可选：限制 speakerKvScale 作用的最大层数
    timbreLockMode: normal        # normal = 普通句锁定基础参考音频，仅特殊高潮句解锁；off = 按 emotion 切参考音频
    specialSceneCfgScaleCaption: 3.6  # 特殊场景（哭喊/耳语/爆发）时的 cfg_scale_caption 引导强度
    emotionLabels: [平静, 开心, 生气, 伤心, 害羞, 惊讶]
  # 角色专属声音（未列出的角色使用上方默认值）
  characters: []
  # characters:
  #   - characterName: 晓山瑞希
  #     refAudioPath: /path/to/ref.wav    # GSV / Irodori 服务端本地路径
  #     promptText: 参考音频说的话        # GSV 用；Irodori 无 caption 时回退到这里
  #     promptLang: ja
  #     gptWeightsPath: ""                # 可选：角色专属 GPT 权重
  #     sovitsWeightsPath: ""             # 可选：角色专属 SoVITS 权重
  #     # 以下仅 Irodori 使用
  #     loraAdapter: /path/to/lora_adapter
  #     caption: 明るく軽い口調で話している。
  #     refAudioPaths: []                 # 多参考音频；非空时优先于 refAudioPath
  #     speed: 1.0
  #     numSteps: 40
  #     emotions:
  #       - emotion: 平静
  #         refAudioPath: /path/to/emotion_refs/calm.wav
  #       - emotion: 开心
  #         refAudioPath: /path/to/emotion_refs/happy.wav
  #         caption: 嬉しそうに話している。
  #         speed: 1.1

# ---------------------------------------------------------------------------
# 背景音乐
#
# 说明：
# - assets.cloudOnly 为 true（默认）时，宿主忽略 resources/audio/bgm/bgm.yaml，
#   直接读取本节（或 MSS_BGM_* 环境变量 / 内置默认值）；
# - assets.cloudOnly 为 false 时，若存在 resources/audio/bgm/bgm.yaml，以它为准，
#   不存在时回落本节（示例见 resources/audio/bgm/bgm.example.yaml）；
# - 剧本里的 ChangeBgm 片段可在场景内切歌/停止；出现带文件的 ChangeBgm 时，
#   path 的全局默认曲目不再混入，只加载被引用的曲目。
# ---------------------------------------------------------------------------
bgm:
  enabled: true                   # 导出时混入 BGM（env: MSS_BGM_ENABLED）
  path: bgm00003                  # 全局默认 BGM：云端 id（如 bgm00003）、曲名、
                                  # 相对资源根路径（如 audio/bgm/bg1.mp3），或 http(s) URL
                                  # （env: MSS_BGM_PATH）
  volume: 0.35                    # 音量 0.0 - 1.0（env: MSS_BGM_VOLUME；已叠加 0.75x ACF 增益，
                                  # 语音期间自动闪避 0.65x，留足人声清晰度与峰值余量）

# ---------------------------------------------------------------------------
# 宿主内置 AI 剧本生成（OpenAI 兼容 Chat Completions）
#
# 客户端只提交一句场景描述，宿主完成「选角 → 台词 → 表演设计 → TTS 翻译」；
# 密钥只从 apiKeyEnv 指定的环境变量读取，不写进本文件：
#   export MSS_LLM_API_KEY=sk-...
# baseUrl 可指向官方 OpenAI、new-api、Ollama（http://127.0.0.1:11434/v1）等。
# ---------------------------------------------------------------------------
llm:
  enabled: true                   # 关闭后 /api/v1/script/generate 返回 422（env: MSS_LLM_ENABLED）
  baseUrl: https://api.openai.com/v1   # 服务根地址，不要重复写 /chat/completions（env: MSS_LLM_BASE_URL）
  apiKeyEnv: MSS_LLM_API_KEY      # 读取密钥的环境变量名（env: MSS_LLM_API_KEY_ENV）
  model: gpt-4.1-mini             # 模型名（env: MSS_LLM_MODEL）
  temperature: 0.85               # 台词创作温度（env: MSS_LLM_TEMPERATURE）
  maxTokens: 8192                 # 单轮输出上限（env: MSS_LLM_MAX_TOKENS）
  timeoutMs: 120000               # 单次 LLM 请求超时（env: MSS_LLM_TIMEOUT_MS）
  retries: 2                      # 网络错误/429/5xx 重试次数（env: MSS_LLM_RETRIES）
  repairRounds: 2                 # single 的校验失败重写轮数；staged 台词/表演各重试一次（env: MSS_LLM_REPAIR_ROUNDS）
  # staged（默认）：选角 → 只写台词（完整重写人设）→ 并行声演/舞台 + 演技设计。
  # hybrid / agent：统一三段式上下文隔离 + 工具驱动流水线（只读工具探索锁定规划 → 独立上下文纯对白与人设 Critic → 并行编译 + 轻量导演终审）。
  # single：快速选角后一次调用写完整剧本（env: MSS_LLM_PIPELINE）。
  pipeline: staged
  agentMaxSteps: 16               # hybrid/agent 模式最大工具调用迭代步数（env: MSS_LLM_AGENT_MAX_STEPS）
  jsonMode: auto                  # auto = 先带 response_format 再回退；on = 必须；off = 不发送
  translateForTts: true           # 把中文台词翻译成 ttsText 日文（env: MSS_LLM_TRANSLATE）
  targetMinutes: 3                # 提示词里的目标成片时长（env: MSS_LLM_TARGET_MINUTES）
  systemPrompt: ""                # single 覆盖内置系统提示词；staged 追加到每段系统提示词（env: MSS_LLM_SYSTEM_PROMPT）
  extraBody: {}                   # 原样并入请求体，例如 {"thinking":{"type":"disabled"}}（env: MSS_LLM_EXTRA_BODY）
  personaDirs: []                 # 人格目录：读取其中的 *.md / *.txt（env: MSS_LLM_PERSONA_DIRS，逗号分隔）
                                  # 长人设只提取核心机制/语言与风格/角色档案/核心禁忌进入对白提示词
  personas: []                    # 内联人格：name / prompt / aliases / group
  polishDialogue: true            # 启用反套路台词质检与条件外科润色（env: MSS_LLM_POLISH_DIALOGUE）
  # 自适应语义 RAG（qwen3-embedding-8b + qwen3-reranker-8b + SQ8 磁盘缓存 + 零网络词法回退；严格 PJSK 领域隔离）
  rag:
    enabled: true                 # env: MSS_RAG_ENABLED
    baseUrl: ""                   # 留空自动继承 llm.baseUrl（env: MSS_RAG_BASE_URL）
    apiKeyEnv: ""                 # 留空自动继承 llm.apiKeyEnv（env: MSS_RAG_API_KEY_ENV）
    model: qwen3-embedding-8b     # Embedding 模型名（env: MSS_RAG_MODEL）
    dimensions: 0                 # 0 = 使用模型原生维度（请求体省略 dimensions），仅 >0 时发送
    queryInstruct: ""             # 留空时 Qwen3-Embedding 自动使用 PJSK 领域查询指令；非空则覆盖
    timeoutMs: 30000
    batchSize: 32
    cacheDir: cache/rag           # 增量 chunkHash SQ8 向量缓存目录（env: MSS_RAG_CACHE_DIR）
    fallbackLexical: true         # Embedding API 不可用时自动降级 BM25+CJK-bigram 检索
    sekaiStorySearchUrl: https://assets.pjsk.moe/sekai-extra-assets/sekai-story-search
    server: cn                    # cn | jp | tw | kr | en
    localDirs: [cache/semantic-build]
    includePersonas: true
    rerank:
      enabled: true               # env: MSS_RAG_RERANK_ENABLED
      model: qwen3-reranker-8b    # Cross-Encoder 重排模型（env: MSS_RAG_RERANK_MODEL）
      baseUrl: ""                 # 留空依次继承 llm.rag.baseUrl -> llm.baseUrl（env: MSS_RAG_RERANK_BASE_URL）
      apiKeyEnv: ""               # 留空依次继承 llm.rag.apiKeyEnv -> llm.apiKeyEnv（env: MSS_RAG_RERANK_API_KEY_ENV）
      endpointPath: /rerank       # 拼接在 baseUrl 后的重排路径（env: MSS_RAG_RERANK_ENDPOINT_PATH）
      candidatePool: 32           # RRF 一阶段送入重排的候选池大小
      topN: 32
      timeoutMs: 30000
      instruction: ""             # 留空自动使用 PJSK 领域默认重排指令
    adaptive:
      minScore: 0.42
      highScore: 0.62
      relativeDropRatio: 0.78
      elbowDropDelta: 0.065
      minChunks: 0
      maxChunks: 12
      softCharBudget: 1800
      maxCharBudget: 4800
      maxPerStory: 2
      mergeAdjacentGap: 4
      expandAdjacentContext: true # 对高分剧情命中块自动向同场景前后扩展 ±1 相邻块
  # personas:
  #   - name: 晓山瑞希
  #     aliases: [瑞希, mizuki]
  #     prompt: |
  #       外貌、性格、说话风格、口头禅、禁忌、表情倾向……

# ---------------------------------------------------------------------------
# 云端资源获取（Moesekai / pjsk.moe）
#
# 从公开剧情库拉取 Live2D 模型与动作，转换成宿主可直接渲染的资源目录。
# 模型包本身没有 motion3：动作是 sse-motion.json，宿主按三次多项式无损转成
# motion3 后写入模型包的 motions/，并自动登记到 models.yaml。
# 常用命令：
#   npm run fetch:models -- --characters mizuki,ena
#   npm run fetch:models -- --characters all
#   npm run fetch:models -- --models 20mizuki_normal_3.0_t04
# ---------------------------------------------------------------------------
assets:
  source: moesekai                # 目前支持 moesekai
  region: jp                      # jp | cn | tw | kr | en（env: MSS_ASSETS_REGION）
  indexBase: https://assets.pjsk.moe/sekai-extra-assets/sekai-live2d/
                                  # 模型索引：<indexBase><region>/models.json
  libraryBase: https://assets.pjsk.moe/sekai-extra-assets/sekai-story/ripper/
                                  # 剧情库：<libraryBase><region>/library/
  assetBase: ""                   # 背景等普通资产；留空按 region 推导 storage.exmeaning.com
  soundtrackBase: https://cdn.jsdelivr.net/gh/Sekai-World/sekai-master-db-diff@master/
                                  # PJSK 官方 BGM 曲名索引；fetch:media 用它把 bgm00003 补成可读曲名
                                  # 不通时可换 raw.githubusercontent.com 镜像（env: MSS_ASSETS_SOUNDTRACK_BASE）
  cacheDir: cache/moesekai        # 动作包缓存（可断点续传，不进 Git；env: MSS_ASSETS_CACHE_DIR）
  concurrency: 4                  # 并行下载数（env: MSS_ASSETS_CONCURRENCY）
  timeoutMs: 180000               # 单个文件下载超时（env: MSS_ASSETS_TIMEOUT_MS）
  retries: 3                      # 下载重试次数（env: MSS_ASSETS_RETRIES）
  cloudCatalog: true              # 云端优先目录：零本地资源（空 resources/ 目录）即可启动、生成与导出 MP4
                                  # 自动暴露全 26 位角色及换装变体+知名配角、~1400 云端背景、~420 剧情/区域 BGM 与 SE；
                                  # 剧本可写背景名（如 神山高校 天台·黄昏）、曲名（Slapstick!!）或云端 id；
                                  # 导出前按需物化到 resources/*/cloud/（env: MSS_ASSETS_CLOUD_CATALOG）
  cloudOnly: true                 # 严格纯云端模式：完全忽略旧本地资源（models.yaml / bgm.yaml / 非 cloud/ 图片与音频 / voices），
                                  # 即使本地有旧 Live2D 模型也只用云端目录并按需物化到 resources/*/cloud/（env: MSS_ASSETS_CLOUD_ONLY）
  cloudCatalogTtlHours: 6         # 目录缓存有效期（小时）；过期后台刷新，失败沿用旧快照
                                  # （env: MSS_ASSETS_CLOUD_CATALOG_TTL_HOURS）

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
logLevel: info                    # silly | trace | debug | info | warn | error | fatal（env: MSS_LOG_LEVEL）

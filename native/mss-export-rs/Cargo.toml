[workspace]
members = [
    "crates/mss-core",
    "crates/mss-audio",
    "crates/mss-encode",
    "crates/mss-bridge",
    "crates/mss-cli",
    "crates/mss-napi",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

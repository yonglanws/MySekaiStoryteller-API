[package]
name = "mss-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Parallel symphonia audio decoder, linear resampler, CRI REACT ducking, 60Hz LipSync, and WAV/AAC mixer"

[dependencies]
mss-core = { path = "../mss-core" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "pcm", "wav", "ogg", "vorbis", "aac", "isomp4"] }
